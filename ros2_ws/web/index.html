<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bras dessinateur</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e22; color: #eee; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 12px 0 0; }
    button, label.file { background: #3b6fd8; color: #fff; border: 0; border-radius: 6px;
                         padding: 8px 14px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    input[type=file] { display: none; }
    #status { font-size: 14px; color: #bbb; }
    #status.error { color: #ff8a80; }
    #view { width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 64px); background: #000; }
  </style>
</head>
<body>
  <header>
    <h1>Bras dessinateur</h1>
    <label class="file">Déposer une image…<input id="file" type="file" accept="image/png,image/jpeg"></label>
    <button data-sample="star.png">Étoile</button>
    <button data-sample="smiley.png">Smiley</button>
    <span id="status" role="status">Connexion à la vue 3D…</span>
  </header>
  <div id="view"></div>

  <script type="module">
    import RFB from '/novnc/core/rfb.js';

    const status = document.getElementById('status');
    const show = (text, error = false) => { status.textContent = text; status.classList.toggle('error', error); };

    // RViz runs fullscreen in the rviz container, noVNC's websockify on port 6080: only the 3D view.
    function connect() {
      const rfb = new RFB(document.getElementById('view'), `ws://${location.hostname}:6080/websockify`);
      rfb.scaleViewport = true;
      rfb.addEventListener('connect', () => show('Prêt : choisis une image.'));
      rfb.addEventListener('disconnect', () => { show('Vue 3D déconnectée, reconnexion…', true); setTimeout(connect, 2000); });
    }
    connect();

    async function draw(body, query = '') {
      try {
        const res = await fetch('/draw' + query, { method: 'POST', body });
        show(await res.text(), !res.ok);
      } catch (e) {
        show('Serveur injoignable', true);
      }
    }
    document.querySelectorAll('[data-sample]').forEach(b =>
      b.addEventListener('click', () => draw(null, '?sample=' + encodeURIComponent(b.dataset.sample))));
    document.getElementById('file').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) draw(file);
      e.target.value = '';
    });
  </script>
</body>
</html>
